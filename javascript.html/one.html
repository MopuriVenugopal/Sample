<html>
    <title>Click button</title>
    <head>
        <body>
            <h2>JavaScript Interaction  </h2>
            <button onclick="displayMessage()"> Click me</button>
            <p id="result"></p>
            <script>
                function displayMessage(){
                    document.getElementById("result").innerHTML="Welcome to Java script!";
                }
            </script>

        </body>
    </head>
</html>
